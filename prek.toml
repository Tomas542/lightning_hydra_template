exclude = "(^.pixi/|.venv/|.snap)"
default_stages = ["pre-commit"]

# builtin

[[repos]]
repo = "builtin"
hooks = [
  { id = "detect-private-key", priority = 0 },
  { id = "check-added-large-files", priority = 2 },
  { id = "end-of-file-fixer", priority = 10 },
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"], priority = 20 },
  { id = "check-yaml", types_or = ["yaml"], priority = 50 },
  { id = "check-json", types_or = ["json"], priority = 30 },
  { id = "check-toml", types_or = ["toml"], priority = 50 },
]

# git specific

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks", priority = 1 },
]

# markdown

[[repos]]
repo = "https://github.com/rbubley/mirrors-prettier"
rev = "v3.9.10"
hooks = [
  {
    id = "prettier",
    files = "^(configs/|docs/|README.md|.yamllint|)",
    types_or = ["yaml", "markdown"],
    priority = 30,
  },
]

[[repos]]
repo = "https://github.com/igorshubovych/markdownlint-cli"
rev = "v0.49.1"
hooks = [
  { id = "markdownlint", priority = 40 },
]

# shell scripts

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"
hooks = [
  {
    id = "shellcheck",
    files = "^scripts/.*\\.sh$",
    priority = 30
  },
]


# pyproject

[[repos]]
repo = "https://github.com/tox-dev/pyproject-fmt"
rev = "v2.30.1"
hooks = [
  {
    id = "pyproject-fmt",
    args = ["--no-print-diff", "--keep-full-version"],
    files = "pyproject.toml",
    priority = 30,
  },
]

[[repos]]
repo = "https://github.com/abravalheri/validate-pyproject"
rev = "0.26"
hooks = [
  {
    id = "validate-pyproject",
    additional_dependencies = ["validate-pyproject-schema-store[all]"],
    files = "pyproject.toml",
    priority = 40,
  },
]


# yaml

[[repos]]
repo = "https://github.com/adrienverge/yamllint.git"
rev = "v1.38.0"
hooks = [
  {
    id = "yamllint",
    args= ["-c=.yamllint", "--strict"],
    files = "^(configs/|.yamllint)",
    types_or = ["yaml"],
    priority = 40,
  },
]


# python

[[repos]]
repo = "https://github.com/srstevenson/nb-clean"
rev = "v5.0.0"
hooks = [
  {
    id = "nb-clean",
    args = ["--remove-empty-cells", "--preserve-cell-outputs"],
    files = "^notebook/",
    priority = 30,
  },
]

[[repos]]
repo = "https://github.com/econchick/interrogate"
rev = "1.7.0"
hooks = [
  {
    id = "interrogate",
    files = "^src/",
    types_or = ["python"],
    priority = 30,
  },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.0"
hooks = [
  {
    id = "ruff-check",
    args = ["--fix"],
    files = "^(src|notebook|tests)/",
    types_or = ["python", "pyi", "jupyter"],
    priority = 40,
  },
  {
    id = "ruff-format",
    files = "^(src|notebook|tests|docs)/|^README.md$",
    types_or = ["python", "pyi", "jupyter", "markdown"],
    priority = 50,
  },
]

[[repos]]
repo = "https://github.com/facebook/pyrefly-pre-commit"
rev = "1.3.2"
hooks = [
  {
    id = "pyrefly-check",
    files = "^(src|notebook|tests)/",
    types_or = ["python", "pyi", "jupyter"],
    priority = 60,
  }
]

[[repos]]
repo = "https://github.com/pre-commit/pygrep-hooks"
rev = "v1.10.0"
hooks = [
  { id = "rst-backticks", files = "^(src|tests)/", types_or = ["python", "pyi"], priority = 70 },
  { id = "rst-directive-colons", files = "^(src|tests)/", types_or = ["python", "pyi"], priority = 80 },
]

[[repos]]
repo = "https://github.com/scientific-python/cookie"
rev = "2026.08.14"
hooks = [
  {
    id = "sp-repo-review",
    name = "Validate Python repository",
    priority = 90,
  },
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.51.1"
hooks = [
  {
    id = "typos",
    priority = 100,
  },
]
